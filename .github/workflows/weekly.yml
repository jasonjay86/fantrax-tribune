name: Weekly Tribune

on:
  # Every Tuesday at 13:00 UTC = 9:00 AM ET (8:00 AM EST in winter).
  # America/New_York handles DST automatically — cron syntax does not, so we
  # use UTC and pick a single offset that lands at 9 AM ET most of the year.
  schedule:
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip LLM call (render with stub commentary)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Serialize weekly runs so a slow LLM call doesn't get stomped by a manual
  # rerun of last week.
  group: weekly-tribune
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Fantrax data
        id: fetch
        run: |
          python scripts/fetch_fantrax.py
          python -c "import json; d=json.load(open('data.json')); w=d.get('week') or 1; print('week='+str(w))" >> "$GITHUB_OUTPUT"

      - name: Compute power rankings
        run: python scripts/power_rankings.py

      - name: Generate LLM commentary
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ -z "$MINIMAX_API_KEY" ]; then
            echo "::notice::No MINIMAX_API_KEY set, or dry_run=true — using stub commentary"
            python scripts/llm_commentary.py --dry-run
          else
            python scripts/llm_commentary.py
          fi

      - name: Render latest edition
        env:
          WEEK_NUM: ${{ steps.fetch.outputs.week }}
        run: |
          python scripts/render.py \
            --out index.html \
            --archive "editions/week-${WEEK_NUM}.html"

      - name: Build archive index
        run: |
          python scripts/build_archive_index.py

      - name: Commit & push if changed
        env:
          WEEK_NUM: ${{ steps.fetch.outputs.week }}
        run: |
          git config user.name "tribune-bot"
          git config user.email "tribune-bot@users.noreply.github.com"
          if git diff --quiet index.html editions/ static/; then
            echo "::notice::No changes to publish this week."
          else
            git add index.html editions/ static/
            git commit -m "Tribune: Week ${WEEK_NUM} edition"
            git push
          fi